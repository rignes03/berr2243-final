<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🚗 Rides Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      padding: 40px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    h1 {
      color: #212529;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    table {
      background: white;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.05);
    }
    thead { background-color: #007bff; color: white; }
    th, td { text-align: center; vertical-align: middle; }
    .container { max-width: 1000px; margin: auto; }
    .btn { padding: 4px 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚖 Rides Dashboard</h1>

    <div class="alert alert-info small">
      This dashboard reads your Postman collection and calls your local API.<br>
      <strong>API base:</strong> <span id="apiBaseText"></span>
    </div>

    <div id="msg" class="text-danger small mb-2"></div>

    <table id="ridesTable" class="table table-striped table-bordered">
      <thead>
        <tr>
          <th>ID</th>
          <th>Pickup Location</th>
          <th>Dropoff Location</th>
          <th>Driver ID</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const API_BASE = window.location.origin;
    document.getElementById('apiBaseText').textContent = API_BASE + '/rides';

    const msgEl = document.getElementById('msg');
    const tbody = document.querySelector('#ridesTable tbody');

    async function loadRides() {
      msgEl.textContent = '';
      tbody.innerHTML = '<tr><td colspan="6">Loading...</td></tr>';
      try {
        const resp = await fetch(API_BASE + '/rides');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const rides = await resp.json();
        tbody.innerHTML = '';
        if (!Array.isArray(rides) || rides.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6">No rides found.</td></tr>';
          return;
        }
        rides.forEach(r => {
          const tr = document.createElement('tr');
          
          // --- FIX: Using YOUR database field names (pickup_location) ---
          tr.innerHTML = `
            <td>${r._id || '-'}</td>
            <td>${r.pickup_location || '-'}</td> 
            <td>${r.dropoff_location || '-'}</td>
            <td>${r.driver_id || '-'}</td>
            <td><span class="badge ${r.status==='cancelled'?'bg-danger':'bg-success'}">${r.status || 'requested'}</span></td>
            <td>
              <button disabled class="btn btn-sm btn-secondary">Delete (Not Implemented)</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
        msgEl.textContent = 'Could not fetch rides. Is your server running?';
      }
    }

    loadRides();
  </script>
</body>
</html>
